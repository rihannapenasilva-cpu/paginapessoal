<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rihanna isabel Pena da Silva</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    

<!--header é a parte do cabeçalho do site, é o topo da página-->
<header class="header">
    <img class="cabecalho_imagem" src="WhatsApp Image .jpeg" alt="Logo da Página">

    <div class="sociais-container">
        <!-- Link do WhatsApp -->
        <a href="https://wa.me" target="_blank" class="link-social">
            <img src="whatsapp.png" alt="Logo do WhatsApp">
        </a>
        
        <!-- Link do Facebook -->
        <a href="https://facebook.com" target="_blank" class="link-social">
            <img src="facebook.png" alt="Logo do Facebook">
        </a>
        
        <!-- Link do Instagram -->
        <a href="https://instagram.com" target="_blank" class="link-social">
            <img src="instagram.png" alt="Logo do Instagram">
        </a>
    </div>
</header>

<!--Seção banner 1 é a parte do paragrafo 1 da página-->
<section class="banner1">
    <!-- Removida a classe repetida da imagem para evitar conflito de estilo -->
    <img src="fita.png" alt="fita onde fica o nome">
    <h1 class="titulo_site">Rihanna Isabel</h1>
</section>



<!--Seção estudantes é a parte do paragrafo 2 da página -- "Meninos"-->
<!--altere em "src="estudante_menino_1.png" para src"nome da imagem do menino em
todos abaixo-->
<!--altere em "src="site_school.png" para src"nome da logo em todos abaixo-->
<!--para aumentar os alunos copie a div no edidor que corresponda desde a foto
até os icones abaixo - dúvidas chame o professor-->









<div class="layout-pagina">
    
    <!-- Controles Invisíveis (Radios) -->
    <input type="radio" name="abas" id="aba-1" checked class="radio-aba">
    <input type="radio" name="abas" id="aba-2" class="radio-aba">
    <input type="radio" name="abas" id="aba-3" class="radio-aba">

    <!-- Coluna da Esquerda: Botões (Labels) -->
    <div class="container-botoes-esquerda">
        <!-- O 'for' conecta o clique diretamente ao ID do input radio acima -->
        <label for="aba-1" class="botao-item" id="btn-aba-1">
            <img src="botao1.png" alt="Botao 1">
        </label>
        
        <label for="aba-2" class="botao-item" id="btn-aba-2">
            <img src="botao2.png" alt="Botao 2">
        </label>
        
        <label for="aba-3" class="botao-item" id="btn-aba-3">
            <img src="botao3.png" alt="Botao 3">
        </label>
    </div>

    <!-- Coluna da Direita: Área das Seções Dinâmicas -->
    <div class="container-secoes-direita">
        
        <!-- Seção 1 -->
        <section class="secao-conteudo secao-1">
            <div class="bloco-imagem">
                <img src="eu.jpg" alt="Imagem Seção 1">
            </div>
            <div class="bloco-texto">
                <h2>QUEM SOU EU </h2>
                <p>Conteúdo da primeira seção. Funciona sem JavaScript!</p>
            </div>
        </section>

        <!-- Seção 2 -->
        <section class="secao-conteudo secao-2">
            <div class="bloco-imagem">
                <img src="imagem2.jpg" alt="Imagem Seção 2">
            </div>
            <div class="bloco-texto">
                <h2>FATOS SOBRE MIM </h2>
                <p>Conteúdo da segunda seção carregado puramente por CSS.</p>
            </div>
        </section>

        <!-- Seção 3 -->
        <section class="secao-conteudo secao-3">
            <div class="bloco-imagem">
                <img src="imagem3.jpg" alt="Imagem Seção 3">
            </div>
            <div class="bloco-texto">
                <h2>PORQUE FAÇO ESSE CURSO</h2>
                <p>Conteúdo da terceira seção completando o layout.</p>
            </div>
        </section>

    </div>
</div>




















<!--Seção rodapé é a parte final da paragrafo 3 da página-->
